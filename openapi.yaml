openapi: 3.1.0
info:
  title: Todo API
  version: 0.1.0
paths:
  /todos:
    post:
      summary: Create Todo Endpoint
      operationId: create_todo_endpoint_todos_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Todos
      operationId: list_todos_todos_get
      parameters:
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /todos/search:
    get:
      summary: Search Todos
      operationId: search_todos_todos_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /todos/{todo_id}:
    get:
      summary: Get Todo Endpoint
      operationId: get_todo_endpoint_todos__todo_id__get
      parameters:
      - name: todo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Todo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Todo non trouvé
    delete:
      summary: Delete Todo Endpoint
      operationId: delete_todo_endpoint_todos__todo_id__delete
      parameters:
      - name: todo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Todo Id
      responses:
        '204':
          description: Todo supprimé (pas de corps)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Todo non trouvé
    patch:
      summary: Patch Todo Endpoint
      operationId: patch_todo_endpoint_todos__todo_id__patch
      parameters:
      - name: todo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Todo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Todo non trouvé
    put:
      summary: Put Todo Endpoint
      operationId: put_todo_endpoint_todos__todo_id__put
      parameters:
      - name: todo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Todo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Todo non trouvé
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    State:
      type: string
      enum:
      - not done
      - in progress
      - done
      title: State
    TodoCreate:
      properties:
        title:
          type: string
          maxLength: 100
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        state:
          $ref: '#/components/schemas/State'
          default: not done
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      required:
      - title
      title: TodoCreate
    TodoUpdate:
      properties:
        title:
          type: string
          maxLength: 100
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        state:
          $ref: '#/components/schemas/State'
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      title: TodoUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
